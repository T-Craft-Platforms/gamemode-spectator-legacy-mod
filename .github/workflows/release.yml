name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check for a semantic version tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re

          tag = os.environ['TAG']
          semver = r'v?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?'
          match = re.fullmatch(semver, tag, flags=re.ASCII)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('valid=' + str(bool(match)).lower(), file=output)
              print('prerelease=' + str(bool(match and match.group(4))).lower(), file=output)
          PY

      - uses: actions/checkout@v4
        if: steps.tag.outputs.valid == 'true'

      - uses: actions/setup-java@v4
        if: steps.tag.outputs.valid == 'true'
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle 3.0
        if: steps.tag.outputs.valid == 'true'
        run: |
          curl --fail --location --retry 3 --output gradle.zip https://services.gradle.org/distributions/gradle-3.0-bin.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-3.0/bin" >> "$GITHUB_PATH"

      - name: Build jar
        if: steps.tag.outputs.valid == 'true'
        run: |
          gradle setupCIWorkspace --no-daemon
          gradle clean build --no-daemon
          cp build/libs/spectator164-0.1.0-dev.jar spectator164.jar

      - name: Publish release asset
        if: steps.tag.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            args=(--verify-tag --generate-notes)
            if [[ "$PRERELEASE" == true ]]; then
              args+=(--prerelease)
            fi
            gh release create "$TAG" "${args[@]}"
          fi
          gh release upload "$TAG" spectator164.jar --clobber
